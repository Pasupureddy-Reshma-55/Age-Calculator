<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="Age.css">
</head>

<body>
    <div id="container">
        <div id="heading">
            <h1 id="age">Age Calculator</h1>
            <h4 id="dis">Discover your age in years, months and days</h4>
        </div>
        <div id="select">
            <h4>📆Your Date of Birth</h4>
            <input type="date" id='date of month' placeholder="📆       dd-mm-yyyy">
            <button id="result">Calculate age</button>
        </div>
        <div id="your-age">
            <p id="years">Years</p>
            <p id="months">Months</p>
            <p id="days">Days</p>
            <p id="total-days">Total Days</p>
        </div>
        <h3>"Every day is a new beginning"</h3>
            <h5>    ───────── ♥ ─────────</h5>
    </div>

</body>
<script src="Age.js"></script>
</html>
